[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fracture-world"
version = "0.2.0"
description = "Engine-free neural dynamics after prescribed cuts in 2D solids"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "torch>=2.5,<3",
    "torch-geometric>=2.6,<3",
    "matplotlib>=3.9,<4",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
teacher = ["felupe>=12,<13"]

[project.scripts]
fracture-world = "fracture_world.stage_a:main"

[project.urls]
MeshGraphNets = "https://arxiv.org/abs/2010.03409"
WindLifter = "https://github.com/Changy1506/WindLifter"
FElupe = "https://github.com/adtzlr/felupe"

[tool.hatch.build.targets.wheel]
packages = ["src/fracture_world"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
