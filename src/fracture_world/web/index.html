<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fracture World · Replay</title>
<style>
:root{font-family:Inter,Segoe UI,system-ui,sans-serif;color:#e5eaf1;background:#111820;color-scheme:dark}*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column}header{padding:22px 28px 16px;display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #29333e}h1{font-size:20px;font-weight:550;margin:5px 0 0;letter-spacing:-.4px}.eyebrow{color:#8fa4b6;font-size:10px;text-transform:uppercase;letter-spacing:2px}#source{align-self:center;color:#a8c8dc;border:1px solid #3b5365;border-radius:20px;padding:7px 12px;font-size:11px}main{flex:1;min-height:200px;position:relative;overflow:hidden}#scene{width:100%;height:100%;display:block}#status{position:absolute;left:24px;top:20px;max-width:560px;font-size:12px;color:#b6c3cf;background:#16222de8;padding:10px 14px;border-radius:6px;border:1px solid #344252}#hint{position:absolute;right:24px;bottom:16px;font-size:10px;letter-spacing:.4px;color:#8898a8}#topology{position:absolute;left:24px;bottom:16px;display:none}.controls{padding:15px 28px;display:flex;align-items:center;gap:18px;border-top:1px solid #29333e}button,select{background:#202d39;color:#dce8f3;border:1px solid #40515f;padding:8px 12px;border-radius:5px;font:inherit;font-size:12px}button{cursor:pointer}button:hover{background:#304353}button:disabled{opacity:.4;cursor:default}input[type=range]{flex:1;accent-color:#d2b688;min-width:40px}#time{font-family:Consolas,monospace;font-size:12px;white-space:nowrap;color:#a5b7c7}.metrics{display:none;padding:0 28px 15px;gap:10px;align-items:center}#plot{width:100%;height:90px;display:block}#metric{max-width:240px}details{font-size:11px;color:#97a9b8;padding:0 28px 16px}summary{cursor:pointer}pre{max-height:160px;overflow:auto;font-size:11px;white-space:pre-wrap}.error{color:#ffbdb5!important;border-color:#8f534c!important}@media(max-width:650px){header{padding:17px;gap:10px}h1{font-size:16px}.controls{padding:12px;gap:9px}#source{font-size:9px;max-width:130px}#status{left:12px;right:12px;font-size:11px}.metrics{padding:0 12px 10px}#hint{right:12px}details{padding:0 12px 12px}}
.display-controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px 18px;padding:10px 28px;border-top:1px solid #29333e;font-size:11px;color:#b6c3cf}.display-controls label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}.display-controls label:has(input:disabled){opacity:.4;cursor:default}.display-controls input{accent-color:#83b6c9}.display-controls .crack-label{color:#ffb17b}.display-controls .support-label{color:#64fff0}#screenshot{margin-left:auto}@media(max-width:650px){.display-controls{padding:10px 12px;gap:9px 12px}#screenshot{font-size:11px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<header><div><div class="eyebrow">Fracture World / Geometry and motion</div><h1 id="title">Recorded fragment motion</h1></div><span id="source">Loading artifact</span></header>
<main><canvas id="scene"></canvas><div id="status">Loading recorded geometry and poses…</div><button id="topology">Show topology</button><span id="hint">Drag to orbit · Scroll to zoom · Z up</span></main>
<div class="display-controls"><label><input id="components" type="checkbox" checked>Component colors</label><label class="crack-label"><input id="cracks" type="checkbox" checked>Crack surfaces</label><label><input id="wireframe" type="checkbox">Wireframe</label><label class="support-label"><input id="supports" type="checkbox">Fixed supports</label><button id="screenshot">Save PNG</button></div>
<div class="controls"><button id="play" disabled>Play</button><input id="scrub" type="range" min="0" max="0" value="0" aria-label="Replay frame"><span id="time">0.000 s</span><select id="speed" aria-label="Playback speed"><option value="0.001">0.001x slow motion</option><option value="0.01">0.01x slow motion</option><option value="0.25">0.25x speed</option><option value="1" selected>1x speed</option><option value="2">2x speed</option></select></div>
<div class="metrics" id="metrics"><select id="metric" aria-label="Recorded metric"></select><canvas id="plot"></canvas></div>
<details><summary>Artifact details</summary><pre id="metadata"></pre></details>
<script type="module">import('/replay.js').catch(error=>{document.querySelector('#status').textContent=`Viewer could not load: ${error.message}${error.message.includes('fetch')?'. Check the pinned Three.js CDN connection.':''}`;document.querySelector('#status').classList.add('error');});</script>
</body>
</html>
